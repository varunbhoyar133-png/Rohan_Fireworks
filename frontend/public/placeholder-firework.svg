<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A243B" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#060913" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" />

  <!-- Subtle Festive Frame -->
  <rect x="25" y="25" width="550" height="550" rx="24" fill="none" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="2" />
  <rect x="35" y="35" width="530" height="530" rx="18" fill="none" stroke="#F59E0B" stroke-opacity="0.08" stroke-dasharray="6,6" stroke-width="1.5" />

  <!-- Corner Embers -->
  <circle cx="50" cy="50" r="3" fill="#F59E0B" opacity="0.4" />
  <circle cx="550" cy="50" r="3" fill="#F59E0B" opacity="0.4" />
  <circle cx="50" cy="550" r="3" fill="#F59E0B" opacity="0.4" />
  <circle cx="550" cy="550" r="3" fill="#F59E0B" opacity="0.4" />

  <!-- Central Firework Emblem -->
  <g transform="translate(300, 240)">
    <!-- Radial Star Rays -->
    <line x1="0" y1="-80" x2="0" y2="-40" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="40" x2="0" y2="80" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="-80" y1="0" x2="-40" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="0" x2="80" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="-56" y1="-56" x2="-28" y2="-28" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="28" y1="28" x2="56" y2="56" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="56" y1="-56" x2="28" y2="-28" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-28" y1="28" x2="-56" y2="56" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Center Diamond Spark -->
    <path d="M0 -30 L8 -8 L30 0 L8 8 L0 30 L-8 8 L-30 0 L-8 -8 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />

    <!-- Glittering Embers -->
    <circle cx="-65" cy="-30" r="2.5" fill="#FEF08A" opacity="0.7" />
    <circle cx="65" cy="30" r="2.5" fill="#FEF08A" opacity="0.7" />
    <circle cx="30" cy="-65" r="2" fill="#EA580C" opacity="0.8" />
    <circle cx="-30" cy="65" r="2" fill="#F59E0B" opacity="0.8" />
  </g>

  <!-- Branded Text -->
  <text x="300" y="380" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#F59E0B" text-anchor="middle">
    ROHAN FIREWORKS
  </text>
  <text x="300" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="1" fill="#94A3B8" text-anchor="middle">
    Product Photograph Pending
  </text>
  <text x="300" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle">
    Admin Image Upload Available in Dashboard
  </text>
</svg>
